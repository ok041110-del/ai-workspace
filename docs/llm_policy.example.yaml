# LLM Policy 규칙 (M5-T01부터 InMemoryLLMPolicyEngine이 실제로 읽어들임)
#
# 최상위 key는 반드시 AgentRole.value(domain/agent.py)와 정확히 일치해야
# 한다: planner / coding / reviewer / documentation / research.
# coordinator는 아직 규칙이 없다(의도적 — LLMPolicyEngine.select()가
# PolicyNotFoundError를 던진다).
# 자세한 배경은 `.ai/RULES.md`의 "Temporary LLM Policy" 참고.

planner:
  provider: openai
  model: gpt
  effort: high

coding:
  provider: anthropic
  model: opus
  effort: high

reviewer:
  provider: openai
  model: gpt
  effort: medium

documentation:
  provider: google
  model: gemini
  effort: low

research:
  provider: xai
  model: grok
  effort: medium
